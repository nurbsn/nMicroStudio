<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00bfa5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Body -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="#1e2736" stroke="url(#frameGrad)" stroke-width="4" />
  
  <!-- Screen Bezel -->
  <rect x="20" y="20" width="88" height="54" rx="10" ry="10" fill="#0f1722" stroke="#2c3b4e" stroke-width="2" />
  
  <!-- Screen Face / Eyes -->
  <rect x="36" y="34" width="14" height="18" rx="4" ry="4" fill="#00e5ff" filter="url(#glow)" />
  <rect x="78" y="34" width="14" height="18" rx="4" ry="4" fill="#00e5ff" filter="url(#glow)" />
  <rect x="46" y="58" width="36" height="4" rx="2" ry="2" fill="#00e5ff" filter="url(#glow)" />
  
  <!-- Controls Panel -->
  <!-- D-Pad -->
  <path d="M 36 86 h 8 v -8 h 6 v 8 h 8 v 6 h -8 v 8 h -6 v -8 h -8 z" fill="#64748b" />
  
  <!-- Action Buttons -->
  <circle cx="82" cy="88" r="6" fill="#ffd740" />
  <circle cx="96" cy="98" r="6" fill="#ff5252" />
</svg>
